{% extends 'base.html' %}

{% block title %}Вход в аккаунт — ДоггиГо{% endblock %}

{% block content %}
<section class="page-section">
    <div class="container auth-container">
        <div class="card-box">
            <h1 class="page-title">Вход в аккаунт</h1>
            <form method="post" class="dog-form">
                {% csrf_token %}
                <div class="field-group">
                    <label for="id_username" class="field-label">Логин</label>
                    <input type="text" name="username" id="id_username" class="form-control" required>
                </div>
                <div class="field-group">
                    <label for="id_password" class="field-label">Пароль</label>
                    <input type="password" name="password" id="id_password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Войти</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
