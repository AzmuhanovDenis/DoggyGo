{% extends 'base.html' %}

{% block title %}Регистрация — ДоггиГо{% endblock %}

{% block content %}
<section class="page-section">
    <div class="container auth-container">
        <div class="card-box">
            <h1 class="page-title">Регистрация владельца</h1>
            <form method="post" class="dog-form">
                {% csrf_token %}
                {% for field in form %}
                <div class="field-group">
                    <label for="{{ field.id_for_label }}" class="field-label">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}<div class="field-error">{{ field.errors|join:", " }}</div>{% endif %}
                </div>
                {% endfor %}
                <button type="submit" class="btn btn-primary btn-full">Зарегистрироваться</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
